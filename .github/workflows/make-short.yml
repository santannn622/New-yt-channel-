name: Make Short

on:
  schedule:
    - cron: "0 9 * * *"   # every day 09:00 UTC - change as you like
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional: force a topic (otherwise next line of topics.txt)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Python deps
        run: pip install -r requirements.txt

      - name: Generate Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: python generate.py

      - name: Keep video + title as artifact
        uses: actions/upload-artifact@v4
        with:
          name: short
          path: |
            output/short.mp4
            output/title.txt
          retention-days: 7

      - name: Save topic progress
        run: |
          git config user.name "shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add topics.txt done.txt || true
          git diff --cached --quiet || (git commit -m "topic used" && git push)
